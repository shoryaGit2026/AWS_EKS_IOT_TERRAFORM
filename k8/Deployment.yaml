apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-service
  namespace: hrm

spec:
  replicas: 2

  selector:
    matchLabels:
      app: employee-service

  template:
    metadata:
      labels:
        app: employee-service

    spec:
      containers:
        - name: employee-service

          image: YOUR_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/employee-service:latest

          ports:
            - containerPort: 8096

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"